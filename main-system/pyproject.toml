[project]
name = "gptbridge-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Python ONLY for 治相關、決策與模型訓練 (per user)
    # All mechanical work (timer/polling/watcher/queue/scheduler/IPC/SQL/transport/test/audit/cleanup) → C/C++/C# or DB native
    "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
build = [
    "pybind11>=2.13,<3",
    "pyinstaller==6.22.2",
    "setuptools>=75,<80",
]
local-model = [
    "beautifulsoup4>=4.12,<5",
    "imageio-ffmpeg==0.6.0",
    "numpy>=1.26,<3",
    "pillow>=10.0,<14",
    "sentence-transformers>=4.1.0",
    "torch>=2.2,<3",
]
gpu = [
    "triton>=3.0,<4",
]

[tool.uv]
package = false
