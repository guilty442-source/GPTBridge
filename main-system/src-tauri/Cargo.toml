[package]
name = "gptbridge-shell"
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"
description = "GPTBridge governed desktop shell (Tauri; replaces the retired Electron host)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
getrandom = "0.2"
sysinfo = "0.33"
walkdir = "2"
opener = "0.7"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_System_Threading",
  "Win32_Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
