[workspace]
resolver = "2"
members = [
    "crates/gptbridge-core",
    "crates/gptbridge-egui",
    "crates/gptbridge-gpui",
]

[workspace.package]
edition = "2021"
rust-version = "1.98.1"
version = "1.0.0"

[workspace.dependencies]
gptbridge-core = { path = "crates/gptbridge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
hex = "0.4"

[package]
name = "gptbridge-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GPTBridge governed desktop shell (Tauri; replaces the retired Electron host)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gptbridge-core.workspace = true
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
hex.workspace = true
opener = { version = "0.7", features = ["reveal"] }
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Foundation",
] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Vendored patch: webview2-com's wait_with_pump used a raw GetMessage loop
# that never dispatches COM apartment calls — a second
# CreateCoreWebView2Controller (embedded-browser child webview) deadlocked
# deterministically once the event loop was running (wry #1665/#583).
# The vendored copy waits with CoWaitForMultipleHandles(
# COWAIT_DISPATCH_CALLS | COWAIT_DISPATCH_WINDOW_MESSAGES) instead.
[patch.crates-io]
webview2-com = { path = "vendor/webview2-com" }
