[package]
name = "ragd"
version = "0.1.0"
edition = "2021"
description = "GPTBridge governed Rust RAG orchestration service (ragd/v1)"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
xstore = { path = "../../xingcheng/src/backend/rust/xstore" }
sha2 = "0.10"
unicode-normalization = "0.1.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
