[package]
name = "ragd"
version = "0.1.0"
edition = "2021"
description = "GPTBridge governed Rust RAG orchestration service (ragd/v1)"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
postgres = { version = "0.19", features = ["with-serde_json-1"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
