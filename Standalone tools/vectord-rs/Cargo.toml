[package]
name = "vectord"
version = "1.0.0"
edition = "2021"
description = "GPTBridge governed Rust vector engine (codex target-primary semantic index)"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hnsw_rs = "0.3.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
