[package]
name = "xstore"
version = "0.1.0"
edition = "2021"
description = "GPTBridge local-model Rust data/safety lane (xstore/v1): untrusted-input boundary — binary format parsing, checkpoint integrity, hashing"
license = "MIT OR Apache-2.0"

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
memmap2 = "0.9"
unicode_categories = "0.1"
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
