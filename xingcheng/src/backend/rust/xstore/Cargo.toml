[package]
name = "xstore"
version = "0.1.0"
edition = "2021"
description = "GPTBridge local-model Rust data/safety lane (xstore/v1): untrusted-input boundary — binary format parsing, checkpoint integrity, hashing"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# float_roundtrip: correctly-rounded f64 parse — the metadata plane
# replays C#-canonical JSON payloads; without it serde_json's fast path
# drifts boundary-case floats by 1 ulp and breaks audit parity.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
memmap2 = "0.9"
unicode_categories = "0.1"
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
