[pytest]
addopts = -p no:cacheprovider
testpaths =
    governance_rule/tests
    governance_rule/execution/git_tiers/tests
    main-system/tests
    shared-layer/tests
norecursedirs =
    .*
    node_modules
    .venv
    dist
    dist-ui
    build
    out
    release
    runtime
    data
    Standalone tools
    backups
    __pycache__
